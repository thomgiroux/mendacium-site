<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mendacium — Contact</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #000000;
    --fg: #e8dcc4;
    --fg-dim: rgba(232, 220, 196, 0.55);
    --fg-faint: rgba(232, 220, 196, 0.30);
    --line: rgba(232, 220, 196, 0.14);
    --card: rgba(232, 220, 196, 0.025);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  html, body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Space Grotesk", sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100%;
  }

  body { padding-bottom: 140px; }

  /* ───── top chrome ───── */
  .chrome {
    position: sticky;
    top: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 24px 40px;
    z-index: 20;
    background: linear-gradient(to bottom, rgba(0,0,0,0.95) 60%, transparent);
    backdrop-filter: blur(4px);
  }
  .chrome .brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    color: var(--fg);
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    text-decoration: none;
  }
  .chrome .brand .dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--fg);
    animation: pulse 3s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:1} }

  .chrome .nav {
    display: inline-flex;
    align-items: center;
    gap: 30px;
  }
  .chrome .nav a {
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--fg-dim);
    text-decoration: none;
    transition: color 0.4s ease;
  }
  .chrome .nav a:hover,
  .chrome .nav a.active { color: var(--fg); }

  /* ───── wrapper ───── */
  .wrap {
    max-width: 920px;
    margin: 0 auto;
    padding: 0 40px;
  }

  /* ───── page header ───── */
  .page-head {
    padding: 72px 0 8px;
  }
  .page-head .eyebrow {
    font-size: 11px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--fg-dim);
    margin-bottom: 22px;
  }
  .page-head h1 {
    font-weight: 300;
    font-size: clamp(44px, 7vw, 88px);
    letter-spacing: -0.025em;
    line-height: 0.98;
  }

  /* ───── section scaffold ───── */
  section.block {
    padding: 72px 0;
    border-top: 1px solid var(--line);
  }
  section.block:first-of-type { border-top: none; }

  .sec-index {
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--fg-faint);
    margin-bottom: 26px;
  }
  .sec-title {
    font-weight: 300;
    font-size: clamp(30px, 4.4vw, 52px);
    letter-spacing: -0.02em;
    line-height: 1.05;
    max-width: 18ch;
    margin-bottom: 32px;
  }
  .lede {
    font-size: 18px;
    font-weight: 300;
    line-height: 1.6;
    color: var(--fg);
    max-width: 62ch;
    margin-bottom: 8px;
  }

  /* subsection heading */
  .subhead {
    font-size: 12px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--fg-dim);
    margin-bottom: 20px;
  }

  /* two-column layout for subsections */
  .cols {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 48px;
    margin-top: 56px;
  }

  /* clean lists */
  ul.clean {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  ul.clean li {
    font-size: 15px;
    font-weight: 300;
    line-height: 1.5;
    color: var(--fg-dim);
    padding-left: 22px;
    position: relative;
  }
  ul.clean li::before {
    content: "";
    position: absolute;
    left: 0;
    top: 10px;
    width: 6px; height: 6px;
    border: 1px solid var(--fg-faint);
    border-radius: 50%;
  }
  ul.clean li b {
    color: var(--fg);
    font-weight: 400;
  }

  /* quality / feature cards */
  .feature-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    margin-top: 48px;
  }
  .feature {
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 28px;
    background: var(--card);
  }
  .feature .q {
    font-weight: 400;
    font-size: 18px;
    letter-spacing: -0.01em;
    margin-bottom: 10px;
  }
  .feature .q-desc {
    font-size: 14px;
    font-weight: 300;
    line-height: 1.55;
    color: var(--fg-dim);
  }

  /* taxonomy block */
  .taxonomy {
    margin-top: 56px;
    border-top: 1px solid var(--line);
    padding-top: 48px;
  }
  .tax-row {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 32px;
    padding: 22px 0;
    border-bottom: 1px solid var(--line);
  }
  .tax-row:last-child { border-bottom: none; }
  .tax-row .tax-name {
    font-weight: 400;
    font-size: 16px;
    letter-spacing: -0.01em;
  }
  .tax-row .tax-detail {
    font-size: 15px;
    font-weight: 300;
    line-height: 1.55;
    color: var(--fg-dim);
  }

  /* methodology steps */
  .steps {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-top: 52px;
  }
  .step {
    display: grid;
    grid-template-columns: 90px 1fr;
    gap: 36px;
    padding: 40px 0;
    border-top: 1px solid var(--line);
  }
  .step:last-child { border-bottom: 1px solid var(--line); }
  .step .num {
    font-weight: 300;
    font-size: 40px;
    line-height: 1;
    color: var(--fg-faint);
    letter-spacing: -0.02em;
  }
  .step .step-title {
    font-weight: 400;
    font-size: 22px;
    letter-spacing: -0.01em;
    margin-bottom: 12px;
  }
  .step .step-body {
    font-size: 16px;
    font-weight: 300;
    line-height: 1.6;
    color: var(--fg-dim);
    max-width: 60ch;
  }

  /* closing CTA */
  .closer {
    margin-top: 96px;
    padding-top: 72px;
    border-top: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 28px;
  }
  .closer p {
    font-weight: 300;
    font-size: clamp(22px, 3vw, 32px);
    letter-spacing: -0.015em;
    line-height: 1.3;
    max-width: 22ch;
  }

  /* ───── button (matched to site) ───── */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    padding: 16px 30px;
    border: 1px solid var(--fg);
    border-radius: 999px;
    color: var(--fg);
    background: transparent;
    text-decoration: none;
    font-family: inherit;
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: color 0.45s ease;
  }
  .btn .fill {
    position: absolute;
    inset: 0;
    background: var(--fg);
    transform: translateY(101%);
    transition: transform 0.55s cubic-bezier(.2,.7,.2,1);
    z-index: 0;
  }
  .btn > span, .btn > .arrow {
    position: relative;
    z-index: 1;
    transition: transform 0.5s cubic-bezier(.2,.7,.2,1);
  }
  .btn:hover { color: var(--bg); }
  .btn:hover .fill { transform: translateY(0); }
  .btn:hover .arrow { transform: translateX(5px); }

  /* fade-in on scroll */
  .reveal {
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.8s cubic-bezier(.2,.7,.2,1), transform 0.8s cubic-bezier(.2,.7,.2,1);
  }
  .reveal.in { opacity: 1; transform: translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1; transform: none; transition: none; }
  }

  /* ───── responsive ───── */
  @media (max-width: 780px) {
    .cols, .feature-grid { grid-template-columns: 1fr; gap: 32px; }
    .tax-row { grid-template-columns: 1fr; gap: 10px; }
    .step { grid-template-columns: 1fr; gap: 12px; }
    .step .num { font-size: 32px; }
    .wrap { padding: 0 24px; }
    .chrome { padding: 20px 24px; }
    .chrome .nav { gap: 20px; }
  }
  /* Original stippled logo, reversed to suit the dark palette. */
  .brand-logo {
    width: 36px; height: 36px; object-fit: contain; flex-shrink: 0;
    filter: invert(1); mix-blend-mode: screen; opacity: .8;
  }
  @media (max-width: 520px) {
    .chrome { padding: 18px 16px; flex-wrap: wrap; gap: 16px; }
    .chrome .nav { gap: 16px; }
  }

  /* Keep the expanded navigation readable on narrow screens. */
  @media (max-width: 780px) {
    .chrome { flex-wrap: wrap; gap: 16px; }
    .chrome .nav { flex-wrap: wrap; justify-content: flex-end; gap: 16px; margin-left: auto; }
  }
  .contact-copy { margin-top: 36px; font-size: clamp(18px, 3vw, 24px); font-weight: 300; line-height: 1.7; }
  .contact-copy a { color: var(--fg); text-underline-offset: 5px; overflow-wrap: anywhere; }
  .contact-copy a:hover { color: var(--fg-dim); }
</style>
</head>
<body>
<header class="chrome">
    <a class="brand" href="index.html"><img class="brand-logo" src="assets/mendacium-logo.png" alt="" width="36" height="36" decoding="async" />Mendacium</a>
    <nav class="nav">
      <a href="datasets.html">Datasets</a>
      <a href="about.html">About</a>
      <a href="index.html">Home</a>
      <a href="/psyop-bench/">Benchmark</a>
      <a href="contact.html" class="active" aria-current="page">Contact</a>
    </nav>
  </header>
  <main class="wrap">
    <div class="page-head"><h1>Contact</h1></div>
    <p class="contact-copy">For any queries, please send a message to:<br>
      <a href="mailto:contact.mendacium@gmail.com">contact.mendacium@gmail.com</a>
    </p>
  </main>
</body>
</html>
