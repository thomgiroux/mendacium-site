<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mendacium</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #000000;
    --fg: #e8dcc4;
    --fg-dim: rgba(232, 220, 196, 0.55);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: "Space Grotesk", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  /* top chrome */
  .chrome {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: 28px 40px;
    z-index: 10;
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .chrome .brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    color: var(--fg);
  }
  .chrome .brand .dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--fg);
    animation: pulse 3s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.4; } 50% { opacity: 1; }
  }

  /* hero */
  .hero {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    position: relative;
  }

  #mask-canvas {
    width: 72vh;
    max-width: 92vw;
    height: 72vh;
    max-height: 78vh;
    display: block;
  }

  /* loading skeleton */
  .skeleton {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) translateY(-40px);
    pointer-events: none;
    opacity: 1;
    transition: opacity 0.8s ease;
  }
  .skeleton.hidden { opacity: 0; }
  .skeleton .ring {
    width: 28px; height: 28px;
    border: 1px solid rgba(232,220,196,0.18);
    border-top-color: var(--fg-dim);
    border-radius: 50%;
    animation: spin360 1.2s linear infinite;
  }
  @keyframes spin360 {
    to { transform: rotate(360deg); }
  }

  /* button */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    padding: 16px 30px;
    border: 1px solid var(--fg);
    border-radius: 999px;
    color: var(--fg);
    background: transparent;
    text-decoration: none;
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: color 0.45s ease;
    z-index: 2;
  }
  .btn .fill {
    position: absolute;
    inset: 0;
    background: var(--fg);
    transform: translateY(101%);
    transition: transform 0.55s cubic-bezier(.2,.7,.2,1);
    z-index: 0;
  }
  .btn > span, .btn > .arrow {
    position: relative;
    z-index: 1;
    transition: transform 0.5s cubic-bezier(.2,.7,.2,1);
  }
  .btn:hover { color: var(--bg); }
  .btn:hover .fill { transform: translateY(0); }
  .btn:hover .arrow { transform: translateX(5px); }

  /* page transition veil — starts opaque, lifts on load, drops on exit */
  #veil {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 999;
    opacity: 1;
    pointer-events: none;
    transition: opacity 0.5s ease;
  }
  body.ready #veil { opacity: 0; }
  body.leaving #veil { opacity: 1; pointer-events: all; }
</style>
</head>
<body>

  <div id="veil"></div>

  <div class="chrome">
    <span class="brand"><span class="dot"></span>Mendacium</span>
  </div>

  <section class="hero">
    <canvas id="mask-canvas"></canvas>
    <div class="skeleton" id="skeleton"><div class="ring"></div></div>

    <a href="datasets.html" class="btn" id="explore">
      <span class="fill"></span>
      <span>Explore Datasets</span>
      <span class="arrow">→</span>
    </a>
  </section>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    // ─── tweakable params ─────────────────────────────────────
    const GLB_PATH        = 'assets/opera-mask.glb';
    const ROTATION_SPEED  = 0.5;    // radians/sec — full 360° Y spin
    const PARALLAX_LERP   = 0.05;   // cursor follow smoothing
    const PARALLAX_TILT   = 0.28;   // max tilt toward cursor (radians)
    const FIT_SIZE        = 2.0;    // world units the model's largest dim maps to
    // ──────────────────────────────────────────────────────────

    const canvas   = document.getElementById('mask-canvas');
    const skeleton = document.getElementById('skeleton');

    // ─── scene / camera / renderer ───────────────────────────
    const scene = new THREE.Scene();
    scene.background = null;                 // transparent → page's #000 shows through

    const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
    camera.position.set(0, 0, 5);

    const renderer = new THREE.WebGLRenderer({
      canvas, antialias: true, alpha: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    // ─── environment (so PBR metal/roughness doesn't render black) ──
    const pmrem = new THREE.PMREMGenerator(renderer);
    const envRT = pmrem.fromScene(new RoomEnvironment(), 0.04);
    scene.environment = envRT.texture;

    // ─── lighting: ambient + directional, dramatic on dark bg ──
    const ambient = new THREE.AmbientLight(0xffffff, 0.25);
    scene.add(ambient);

    // key — strong directional from upper right
    const key = new THREE.DirectionalLight(0xfff1d6, 2.6);
    key.position.set(3, 4, 3);
    scene.add(key);

    // fill — soft, cool, from the left
    const fill = new THREE.DirectionalLight(0xc6d4e8, 0.7);
    fill.position.set(-3, 0.5, 2);
    scene.add(fill);

    // rim — warm backlight to separate the silhouette from black
    const rim = new THREE.DirectionalLight(0xffd9a8, 0.9);
    rim.position.set(-1, 1, -3);
    scene.add(rim);

    // ─── pivot group (so auto-rotation + parallax compose cleanly) ──
    const pivot = new THREE.Group();
    scene.add(pivot);

    // ─── load model ──────────────────────────────────────────
    const loader = new GLTFLoader();
    loader.load(
      GLB_PATH,
      (gltf) => {
        const model = gltf.scene;

        // center on origin and scale to a consistent size
        const box = new THREE.Box3().setFromObject(model);
        const size = new THREE.Vector3();
        const center = new THREE.Vector3();
        box.getSize(size);
        box.getCenter(center);

        const maxDim = Math.max(size.x, size.y, size.z) || 1;
        const scale = FIT_SIZE / maxDim;
        model.scale.setScalar(scale);

        // re-evaluate center after scaling and offset so model sits at origin
        model.position.set(
          -center.x * scale,
          -center.y * scale,
          -center.z * scale
        );

        pivot.add(model);
        skeleton.classList.add('hidden');
      },
      undefined,
      (err) => {
        console.error('[mendacium] failed to load GLB:', err);
        skeleton.classList.add('hidden');
      }
    );

    // ─── interaction: smooth cursor parallax ─────────────────
    const targetTilt  = { x: 0, y: 0 };
    const currentTilt = { x: 0, y: 0 };

    window.addEventListener('mousemove', (e) => {
      const nx = (e.clientX / window.innerWidth)  * 2 - 1;
      const ny = (e.clientY / window.innerHeight) * 2 - 1;
      targetTilt.y = nx * PARALLAX_TILT;
      targetTilt.x = -ny * PARALLAX_TILT * 0.5;
    });

    // ─── render loop ─────────────────────────────────────────
    const clock = new THREE.Clock();

    function animate() {
      const dt = clock.getDelta();

      // auto-rotate the model itself on Y
      pivot.rotation.y += ROTATION_SPEED * dt;

      // parallax tilts the whole pivot toward the cursor
      currentTilt.x += (targetTilt.x - currentTilt.x) * PARALLAX_LERP;
      currentTilt.y += (targetTilt.y - currentTilt.y) * PARALLAX_LERP;
      pivot.rotation.x = currentTilt.x;
      pivot.position.x = currentTilt.y * 0.15;

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    // ─── responsive ──────────────────────────────────────────
    function resize() {
      const rect = canvas.getBoundingClientRect();
      const w = rect.width, h = rect.height;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);

    resize();
    animate();
  </script>

  <script>
    // ─── seamless page transition (no white flash) ───────────
    requestAnimationFrame(() => document.body.classList.add('ready'));
    window.addEventListener('pageshow', () => {
      // handle back/forward cache restore
      document.body.classList.remove('leaving');
      document.body.classList.add('ready');
    });
    const explore = document.getElementById('explore');
    if (explore) {
      explore.addEventListener('click', (e) => {
        e.preventDefault();
        document.body.classList.add('leaving');
        setTimeout(() => { window.location.href = explore.getAttribute('href'); }, 480);
      });
    }
  </script>
</body>
</html>
